name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TetrisLite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Salva anche l'APK pronto nel repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT="$(base64 -w0 app/build/outputs/apk/debug/app-debug.apk)"
          FILE_PATH="downloads/TetrisLite2.apk"
          SHA="$(gh api "repos/${{ github.repository }}/contents/$FILE_PATH" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/${{ github.repository }}/contents/$FILE_PATH" -f message="Pubblica APK TetrisLite2 v1.1" -f content="$CONTENT" -f sha="$SHA" > /dev/null
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/$FILE_PATH" -f message="Pubblica APK TetrisLite2 v1.1" -f content="$CONTENT" > /dev/null
          fi

      - name: Pubblica APK con link di download diretto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view tetrislite2-latest > /dev/null 2>&1 || gh release create tetrislite2-latest --target main --title "TetrisLite2 - Ultima versione" --notes "APK Android compilato automaticamente da GitHub Actions." --latest
          gh release upload tetrislite2-latest "app/build/outputs/apk/debug/app-debug.apk#TetrisLite2.apk" --clobber
